[package]
name = "tessera"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tessera DAW desktop application"
publish = false

[dependencies]
tessera-engine = { path = "../engine" }
tessera-plugin-host = { path = "../plugin-host" }
tessera-mp3 = { path = "../mp3" }
serde.workspace = true
serde_json.workspace = true
hound.workspace = true
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
cpal = "0.18"
rtrb.workspace = true
rfd = "0.17"
midir = "0.11"

[target.'cfg(windows)'.dependencies]
# WASAPI exclusive mode (cpal only opens WASAPI shared).
windows = { version = "0.62", features = [
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[features]
# Steinberg ASIO drivers on Windows. Needs LLVM (clang) and the Visual Studio
# C++ build tools; the build downloads the ASIO SDK from Steinberg, or uses the
# copy CPAL_ASIO_DIR points at. See the README ("ASIO on Windows").
asio = ["cpal/asio"]
# JACK on Linux and macOS (needs the JACK development files).
jack = ["cpal/jack"]
