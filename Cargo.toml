[workspace]
resolver = "2"
members = ["crates/engine", "crates/app", "crates/plugin-host", "crates/test-plugin", "crates/mp3"]
# Plain `cargo run` / `cargo build` at the root mean the app. CI and tests use
# --workspace to cover every crate.
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rtrb = "0.4"
hound = "3.5"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
